<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة إعداد المحاضر والمستندات | أ. علي محمد علي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style> body { font-family: 'Cairo', sans-serif; } </style>
</head>
<body class="bg-slate-100 text-slate-800">

    <header class="bg-slate-900 text-white shadow-md">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3 space-x-reverse">
                <div class="bg-amber-600 text-white p-2 rounded-lg"><i class="fa-solid fa-scale-balanced text-lg"></i></div>
                <h1 class="text-lg font-bold">نظام إدارة المحاضر والقضايا - أ. علي محمد علي</h1>
            </div>
            <a href="index.html" class="bg-slate-800 hover:bg-slate-700 text-amber-400 px-4 py-2 rounded-lg text-sm font-semibold transition border border-slate-700">
                <i class="fa-solid fa-house ml-1"></i> العودة للموقع الرئيسي
            </a>
        </div>
    </header>

    <main class="container mx-auto max-w-4xl py-10 px-6">
        <div class="bg-white rounded-2xl shadow-md p-8 border border-slate-200">
            <div class="border-b border-slate-200 pb-6 mb-6">
                <h2 class="text-2xl font-bold text-slate-900">تحرير محضر جديد أو مذكرة دفاع</h2>
                <p class="text-slate-500 text-sm mt-1">سجل بيانات القضية وصغ المحضر وارفق صور المستندات المطلوبة بكل سهولة.</p>
            </div>

            <form onsubmit="event.preventDefault(); alert('تم حفظ المحضر ورفع المستندات بنجاح!');" class="space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-slate-700 text-sm font-semibold mb-2">رقم المحضر / الدعوى</label>
                        <input type="text" placeholder="مثال: لسنة 2026 جنح..." required class="w-full px-4 py-3 rounded-xl border border-slate-300 bg-slate-50">
                    </div>
                    <div>
                        <label class="block text-slate-700 text-sm font-semibold mb-2">الجهة القضائية (المحكمة / القسم)</label>
                        <input type="text" placeholder="مثال: محكمة جنح العاصمة" required class="w-full px-4 py-3 rounded-xl border border-slate-300 bg-slate-50">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-slate-700 text-sm font-semibold mb-2">اسم الموكل</label>
                        <input type="text" placeholder="الاسم الثلاثي" required class="w-full px-4 py-3 rounded-xl border border-slate-300 bg-slate-50">
                    </div>
                    <div>
                        <label class="block text-slate-700 text-sm font-semibold mb-2">اسم الخصم</label>
                        <input type="text" placeholder="اسم الخصم" required class="w-full px-4 py-3 rounded-xl border border-slate-300 bg-slate-50">
                    </div>
                </div>

                <div>
                    <label class="block text-slate-700 text-sm font-semibold mb-2">مضمون المحضر / الدفوع القانونية</label>
                    <textarea rows="6" placeholder="اكتب تفاصيل المحضر هنا..." required class="w-full px-4 py-3 rounded-xl border border-slate-300 bg-slate-50"></textarea>
                </div>

                <!-- مكان رفع الصور والمستندات -->
                <div class="bg-slate-50 border-2 border-dashed border-slate-300 rounded-2xl p-6 text-center">
                    <div class="text-amber-600 text-3xl mb-2"><i class="fa-solid fa-cloud-arrow-up"></i></div>
                    <h3 class="text-base font-bold text-slate-800">إرفاق صور المستندات، التوكيلات، أو أدلة الإثبات</h3>
                    <p class="text-slate-500 text-xs mt-1 mb-4">يمكنك رفع صور بصيغة JPG, PNG أو ملفات PDF</p>
                    <input type="file" multiple accept="image/*,.pdf" class="block w-full max-w-xs mx-auto text-sm text-slate-500
                        file:mr-4 file:py-2.5 file:px-4 file:rounded-xl file:border-0
                        file:text-sm file:font-semibold file:bg-amber-600 file:text-white hover:file:bg-amber-700 cursor-pointer">
                </div>

                <div class="flex gap-4 pt-4">
                    <button type="submit" class="flex-1 bg-amber-600 hover:bg-amber-700 text-white font-bold py-3.5 rounded-xl transition shadow-md">
                        <i class="fa-solid fa-floppy-disk ml-2"></i> حفظ المحضر والمستندات
                    </button>
                    <button type="reset" class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold px-6 py-3.5 rounded-xl transition">إفريغ الحقول</button>
                </div>
            </form>
        </div>
    </main>

</body>
</html>
